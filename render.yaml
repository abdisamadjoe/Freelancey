# Render blueprint for the Gigly API (NestJS).
# Secrets use `sync: false`, so Render asks for them on first deploy and they never live in git.
services:
  - type: web
    name: gigly-api
    runtime: node
    plan: free
    rootDir: backend
    branch: main
    autoDeploy: true
    # NODE_ENV=production on Render skips devDependencies, which the build needs (nest CLI, prisma, typescript).
    buildCommand: npm ci --include=dev && npm run build
    # Applies pending Prisma migrations, then starts the API.
    startCommand: npm run db:migrate:deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Aiven Postgres (add ?sslmode=require). DIRECT_URL is used by `prisma migrate`.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Do not regenerate APP_ENCRYPTION_SECRET: it decrypts data already stored in the database.
      - key: APP_ENCRYPTION_SECRET
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      # Dashboard URL (CORS and links) and this service's own public URL.
      - key: WEB_URL
        sync: false
      - key: API_URL
        sync: false
      # Cloudflare R2 file storage is optional. Without these four, files use local (ephemeral) disk.
      # - key: R2_ACCOUNT_ID
      # - key: R2_ACCESS_KEY_ID
      # - key: R2_SECRET_ACCESS_KEY
      # - key: R2_BUCKET_NAME
